
<!DOCTYPE html>
<html>
<head>
    <title>Online Book Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Online Book Management System</h1>

    <form id="bookForm">
        <input type="text" id="title" placeholder="Book Title" required>
        <input type="text" id="author" placeholder="Author" required>
        <input type="number" id="price" placeholder="Price" min="0.01" step="0.01" required>

        <button type="submit" id="submitBtn">Add Book</button>
        <button type="button" id="cancelBtn" onclick="resetForm()" hidden>Cancel</button>
    </form>

    <h2>Book List</h2>

    <p id="message"></p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="bookList"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
